version: '3.8'

services:
  forensic-framework:
    build: .
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./output:/workspace/output
      - ./config:/workspace/config
    ports:
      - "5001:5001"
    environment:
      - ANDROID_SDK_ROOT=/usr/lib/android-sdk
    command: python3 experiments/run_real_device.py 33 config/scenarios/baseline_50.yaml
