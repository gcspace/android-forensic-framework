name: "20步基准场景（同族）"
description: "用于规模扩展性测试的20原子标准场景（由50场景同比例派生，含一处并行分支）"
api_level: 33

nodes:
  # === UI交互层 (12个，占比60%) ===
  - id: click_1
    type: UI_CLICK
    params: {x: 100, y: 200}
    estimated_cost: 0.5
    depends_on: []
  
  - id: click_2
    type: UI_CLICK
    params: {x: 300, y: 400}
    estimated_cost: 0.5
    depends_on: [click_1]
  
  - id: click_3
    type: UI_CLICK
    params: {x: 200, y: 300}
    estimated_cost: 0.5
    depends_on: [click_2]
  
  - id: click_4
    type: UI_CLICK
    params: {x: 150, y: 250}
    estimated_cost: 0.5
    depends_on: [click_3]
  
  - id: click_5
    type: UI_CLICK
    params: {x: 500, y: 300}
    estimated_cost: 0.5
    depends_on: [click_4]
  
  - id: click_6
    type: UI_CLICK
    params: {x: 400, y: 500}
    estimated_cost: 0.5
    depends_on: [click_5]
  
  - id: click_7
    type: UI_CLICK
    params: {x: 250, y: 350}
    estimated_cost: 0.5
    depends_on: [click_6]
  
  - id: click_8
    type: UI_CLICK
    params: {x: 350, y: 250}
    estimated_cost: 0.5
    depends_on: [click_7]
  
  - id: swipe_1
    type: UI_SWIPE
    params: {x1: 100, y1: 500, x2: 300, y2: 500, duration: 300}
    estimated_cost: 0.8
    depends_on: [click_7]
  
  - id: swipe_2
    type: UI_SWIPE
    params: {x1: 200, y1: 800, x2: 200, y2: 200, duration: 400}
    estimated_cost: 1.0
    depends_on: [swipe_1]
  
  - id: input_1
    type: UI_INPUT
    params: {text: "test_input_1"}
    estimated_cost: 0.3
    depends_on: [swipe_2]
  
  - id: input_2
    type: UI_INPUT
    params: {text: "test_input_2"}
    estimated_cost: 0.3
    depends_on: [input_1]
  
  # === 文件操作层 (5个，占比25%) ===
  - id: file_create_1
    type: FILE_CREATE
    params: {path: "test1.txt", content: "Hello World 1", is_media: false}
    estimated_cost: 0.8
    depends_on: [input_2]
  
  - id: file_create_2
    type: FILE_CREATE
    params: {path: "test2.txt", content: "Hello World 2", is_media: false}
    estimated_cost: 0.8
    depends_on: [file_create_1]
  
  - id: file_create_3
    type: FILE_CREATE
    params: {path: "test3.txt", content: "Hello World 3", is_media: false}
    estimated_cost: 0.8
    depends_on: [file_create_2]
  
  - id: file_copy_1
    type: FILE_COPY
    params: {src: "test1.txt", dst: "test1_copy.txt", is_media: false}
    estimated_cost: 0.6
    depends_on: [file_create_3]
  
  - id: file_delete_1
    type: FILE_DELETE
    params: {path: "test2.txt", is_media: false}
    estimated_cost: 0.4
    depends_on: [file_copy_1]
  
  # === 应用操作层 (3个，占比15%) ===
  - id: app_start_1
    type: APP_START
    params: {package: "com.android.settings"}
    estimated_cost: 1.8
    depends_on: [file_delete_1]
  
  - id: app_start_2
    type: APP_START
    params: {package: "com.android.settings"}
    estimated_cost: 1.8
    depends_on: [app_start_1]
  
  - id: app_stop_1
    type: APP_STOP
    params: {package: "com.android.settings"}
    estimated_cost: 0.4
    depends_on: [app_start_2]
