name: "勒索加密场景"
description: "模拟恶意应用遍历外部存储文档、图片并加密 (35原子)"
api_level: 33

nodes:
  # === 阶段1: 初始准备 (8原子) ===
  - id: click_1
    type: UI_CLICK
    params: {x: 100, y: 200}
    estimated_cost: 0.5
    depends_on: []
  
  - id: click_2
    type: UI_CLICK
    params: {x: 300, y: 400}
    estimated_cost: 0.5
    depends_on: [click_1]
  
  - id: swipe_1
    type: UI_SWIPE
    params: {x1: 100, y1: 500, x2: 300, y2: 500, duration: 300}
    estimated_cost: 0.8
    depends_on: [click_2]
  
  - id: click_3
    type: UI_CLICK
    params: {x: 200, y: 300}
    estimated_cost: 0.5
    depends_on: [swipe_1]
  
  - id: input_1
    type: UI_INPUT
    params: {text: "ransomware_exec"}
    estimated_cost: 0.3
    depends_on: [click_3]
  
  - id: click_4
    type: UI_CLICK
    params: {x: 400, y: 500}
    estimated_cost: 0.5
    depends_on: [input_1]
  
  - id: swipe_2
    type: UI_SWIPE
    params: {x1: 500, y1: 300, x2: 100, y2: 300, duration: 300}
    estimated_cost: 0.8
    depends_on: [click_4]
  
  - id: click_5
    type: UI_CLICK
    params: {x: 540, y: 400}
    estimated_cost: 0.5
    depends_on: [swipe_2]
  
  # === 阶段2: 遍历文档文件 (11原子，原12个删除doc_scan_12) ===
  - id: doc_scan_1
    type: FILE_CREATE
    params: {path: "Documents/doc_1.pdf", content: "PDF: Document 1 content", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: doc_scan_2
    type: FILE_CREATE
    params: {path: "Documents/doc_2.docx", content: "DOCX: Document 2 content", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: doc_scan_3
    type: FILE_CREATE
    params: {path: "Documents/doc_3.xlsx", content: "XLSX: Spreadsheet 3 content", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: doc_scan_4
    type: FILE_CREATE
    params: {path: "Documents/doc_4.ppt", content: "PPT: Presentation 4 content", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: doc_scan_5
    type: FILE_CREATE
    params: {path: "Documents/doc_5.txt", content: "TXT: Important notes 5", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: doc_scan_6
    type: FILE_CREATE
    params: {path: "Documents/doc_6.md", content: "MD: Readme 6", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: doc_scan_7
    type: FILE_CREATE
    params: {path: "Documents/doc_7.json", content: '{"data": "sensitive_data_7"}', is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: doc_scan_8
    type: FILE_CREATE
    params: {path: "Documents/doc_8.xml", content: "<config><value>data_8</value></config>", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: doc_scan_9
    type: FILE_CREATE
    params: {path: "Documents/doc_9.csv", content: "col1,col2\nval1,val2", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: doc_scan_10
    type: FILE_CREATE
    params: {path: "Documents/doc_10.log", content: "LOG: System log entry 10", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: doc_scan_11
    type: FILE_CREATE
    params: {path: "Documents/doc_11.yaml", content: "key: value", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  # === 阶段3: 遍历图片文件 (12原子) ===
  - id: img_scan_1
    type: FILE_CREATE
    params: {path: "Pictures/img_1.jpg", content: "JPG: Image 1", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: img_scan_2
    type: FILE_CREATE
    params: {path: "Pictures/img_2.png", content: "PNG: Image 2", is_media: true}
