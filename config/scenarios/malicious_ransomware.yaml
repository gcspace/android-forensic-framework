    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: img_scan_6
    type: FILE_CREATE
    params: {path: "Pictures/img_6.svg", content: "SVG: Image 6", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: img_scan_7
    type: FILE_CREATE
    params: {path: "Pictures/img_7.tiff", content: "TIFF: Image 7", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: img_scan_8
    type: FILE_CREATE
    params: {path: "Pictures/img_8.heic", content: "HEIC: Image 8", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  
  - id: doc_scan_12
    type: FILE_CREATE
    params: {path: "Documents/doc_12.pdf", content: "PDF: Document 12 content", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  - id: doc_scan_13
    type: FILE_CREATE
    params: {path: "Documents/doc_13.pdf", content: "PDF: Document 13 content", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  - id: doc_scan_14
    type: FILE_CREATE
    params: {path: "Documents/doc_14.pdf", content: "PDF: Document 14 content", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  - id: doc_scan_15
    type: FILE_CREATE
    params: {path: "Documents/doc_15.pdf", content: "PDF: Document 15 content", is_media: true}
    estimated_cost: 1.0
    depends_on: [click_5]
  - id: img_scan_9
    type: FILE_CREATE
    params: {path: "Pictures/img_9.jpg", content: "JPG: Image 9", is_media: true}
    estimated_cost: 1.0
    depends_on: [img_scan_8]
  
  - id: img_scan_10
    type: FILE_CREATE
    params: {path: "Pictures/img_10.png", content: "PNG: Image 10", is_media: true}
    estimated_cost: 1.0
    depends_on: [img_scan_9]
  
  - id: img_scan_11
    type: FILE_CREATE
    params: {path: "Pictures/img_11.jpg", content: "JPG: Image 11", is_media: true}
    estimated_cost: 1.0
    depends_on: [img_scan_10]
  
  - id: img_scan_12
    type: FILE_CREATE
    params: {path: "Pictures/img_12.jpg", content: "JPG: Image 12", is_media: true}
    estimated_cost: 1.0
    depends_on: [img_scan_11]
  
  # === 阶段4: 加密与源文件删除 (15原子) ===
