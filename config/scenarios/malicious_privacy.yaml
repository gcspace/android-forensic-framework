name: "隐私窃取场景"
description: "模拟恶意应用读取短信、相册、浏览器缓存并打包存储 (48原子)"
api_level: 33

nodes:
  # === 阶段1: 初始UI交互 (10原子) ===
  - id: click_1
    type: UI_CLICK
    params: {x: 100, y: 200}
    estimated_cost: 0.5
    depends_on: []
  
  - id: click_2
    type: UI_CLICK
    params: {x: 300, y: 400}
    estimated_cost: 0.5
    depends_on: [click_1]
  
  - id: swipe_1
    type: UI_SWIPE
    params: {x1: 100, y1: 500, x2: 300, y2: 500, duration: 300}
    estimated_cost: 1.0
    depends_on: [click_2]
  
  - id: click_3
    type: UI_CLICK
    params: {x: 200, y: 300}
    estimated_cost: 0.5
    depends_on: [swipe_1]
  
  - id: input_1
    type: UI_INPUT
    params: {text: "privacy_test"}
    estimated_cost: 0.3
    depends_on: [click_3]
  
  - id: click_4
    type: UI_CLICK
    params: {x: 150, y: 250}
    estimated_cost: 0.5
    depends_on: [input_1]
  
  - id: swipe_2
    type: UI_SWIPE
    params: {x1: 200, y1: 800, x2: 200, y2: 200, duration: 400}
    estimated_cost: 1.2
    depends_on: [click_4]
  
  - id: click_5
    type: UI_CLICK
    params: {x: 500, y: 300}
    estimated_cost: 0.5
    depends_on: [swipe_2]
  
  - id: input_2
    type: UI_INPUT
    params: {text: "target_device"}
    estimated_cost: 0.3
    depends_on: [click_5]
  
  - id: click_6
    type: UI_CLICK
    params: {x: 400, y: 500}
    estimated_cost: 0.5
    depends_on: [input_2]
  
  # === 阶段2: 短信读取模拟 (8原子) ===
  - id: sms_access_1
    type: FILE_CREATE
    params: {path: "sms_backup_1.txt", content: "SMS: Hello from 13800138000", is_media: true}
    estimated_cost: 1.5
    depends_on: [click_6]
  
  - id: sms_access_2
    type: FILE_CREATE
    params: {path: "sms_backup_2.txt", content: "SMS: Verification code 123456", is_media: true}
